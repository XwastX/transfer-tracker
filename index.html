<title>Transfer Tracker</title>
<meta name="description" content="Дашборд рыночной стоимости футболистов, ленты трансферов и стоимости составов." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ───────────────────────────────────────────────────────────────────────────
   Transfer Tracker — тёмная тема.
   Палитра графиков валидирована по чек-листу дата-виз (CVD ΔE, контраст ≥3:1
   на поверхности #141922).
   ─────────────────────────────────────────────────────────────────────────── */

:root {
  color-scheme: dark;

  /* поверхности */
  --bg:          #0a0d13;
  --surface-1:   #141922;   /* карточки и поверхность графиков */
  --surface-2:   #1b212c;   /* вложенные блоки, hover */
  --surface-3:   #232a36;
  --border:      rgba(255, 255, 255, 0.08);
  --border-soft: rgba(255, 255, 255, 0.05);

  /* текст */
  --text:        #ffffff;
  --text-2:      #a8b1c1;
  --muted:       #717d90;

  /* графики */
  --series-1:    #3987e5;   /* blue  */
  --series-2:    #d95926;   /* orange */
  --series-3:    #199e70;   /* aqua  */
  --grid:        #232a36;
  --axis:        #2f3644;

  /* статус */
  --good:        #0ca30c;
  --good-ink:    #46d16d;
  --critical:    #d03b3b;
  --critical-ink:#f07070;
  --warning:     #fab219;

  --radius:      14px;
  --radius-sm:   9px;
  --shadow:      0 10px 30px rgba(0, 0, 0, .45);
  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
}

* { box-sizing: border-box; }

/* Авторские display-правила ниже перебивают браузерное [hidden]{display:none} —
   возвращаем его принудительно, иначе скрытые блоки остаются на экране. */
[hidden] { display: none !important; }

html, body { height: 100%; }

body {
  margin: 0;
  background:
    radial-gradient(1100px 520px at 78% -12%, rgba(57, 135, 229, .13), transparent 62%),
    radial-gradient(760px 420px at 6% 0%, rgba(25, 158, 112, .08), transparent 60%),
    var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
button { font: inherit; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 8px; border: 2px solid var(--bg); }
::-webkit-scrollbar-track { background: transparent; }

/* ── Топбар ───────────────────────────────────────────────────────────────── */
.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 18px;
  padding: 12px 22px;
  background: rgba(10, 13, 19, .82);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}

.brand { display: flex; align-items: center; gap: 10px; flex: none; }
.brand-mark {
  display: grid; place-items: center; width: 34px; height: 34px;
  border-radius: 10px; color: #fff;
  background: linear-gradient(140deg, var(--series-1), #1c5cab);
  box-shadow: 0 4px 14px rgba(57, 135, 229, .32);
}
.brand-text { font-size: 15px; letter-spacing: -.2px; color: var(--text-2); }
.brand-text b { color: var(--text); font-weight: 700; }

.search { position: relative; flex: 1; max-width: 460px; }
.search-ico {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  color: var(--muted); pointer-events: none;
}
.search input {
  width: 100%; height: 38px; padding: 0 12px 0 34px;
  background: var(--surface-1); color: var(--text);
  border: 1px solid var(--border); border-radius: 10px;
  outline: none; transition: border-color .15s, box-shadow .15s;
}
.search input::placeholder { color: var(--muted); }
.search input:focus { border-color: var(--series-1); box-shadow: 0 0 0 3px rgba(57, 135, 229, .18); }

.search-results {
  position: absolute; top: 44px; left: 0; right: 0; z-index: 50;
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 12px; box-shadow: var(--shadow); overflow: hidden;
  max-height: 340px; overflow-y: auto;
}
.search-results button {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 9px 12px; background: none; border: 0; color: var(--text);
  text-align: left; cursor: pointer;
}
.search-results button:hover { background: var(--surface-2); }
.search-results .sr-name { font-weight: 500; }
.search-results .sr-club { color: var(--muted); font-size: 12px; }
.search-results .sr-val { margin-left: auto; color: var(--text-2); font-variant-numeric: tabular-nums; }
.search-empty { padding: 12px; color: var(--muted); }

.topbar-right { display: flex; align-items: center; gap: 10px; margin-left: auto; flex: none; }

.pill {
  display: inline-flex; align-items: center; gap: 7px;
  height: 30px; padding: 0 11px; border-radius: 999px;
  font-size: 12px; font-weight: 500;
  border: 1px solid var(--border); background: var(--surface-1); color: var(--text-2);
}
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill--live { color: var(--good-ink); border-color: rgba(70, 209, 109, .3); }
.pill--live .dot { box-shadow: 0 0 0 0 rgba(70, 209, 109, .5); animation: pulse 2s infinite; }
.pill--seed { color: var(--warning); border-color: rgba(250, 178, 25, .28); }
.pill--error { color: var(--critical-ink); border-color: rgba(240, 112, 112, .3); }
@keyframes pulse {
  0%   { box-shadow: 0 0 0 0 rgba(70, 209, 109, .45); }
  70%  { box-shadow: 0 0 0 7px rgba(70, 209, 109, 0); }
  100% { box-shadow: 0 0 0 0 rgba(70, 209, 109, 0); }
}

.btn {
  display: inline-flex; align-items: center; gap: 7px;
  height: 32px; padding: 0 12px; border-radius: 9px; cursor: pointer;
  border: 1px solid var(--border); background: var(--surface-1); color: var(--text-2);
  transition: background .15s, color .15s, border-color .15s;
}
.btn:hover { background: var(--surface-2); color: var(--text); }
.btn--primary { background: var(--series-1); border-color: transparent; color: #fff; }
.btn--primary:hover { background: #2a78d6; color: #fff; }
.btn[disabled] { opacity: .5; cursor: default; }

/* ── Полоса прогресса сборки ──────────────────────────────────────────────── */
.build-bar {
  position: sticky; top: 63px; z-index: 35;
  display: flex; align-items: center; gap: 10px;
  height: 30px; padding: 0 22px; font-size: 12px; color: var(--text-2);
  background: rgba(20, 25, 34, .9); border-bottom: 1px solid var(--border);
  overflow: hidden;
}
.build-bar-fill {
  position: absolute; inset: 0 auto 0 0; width: 0;
  background: linear-gradient(90deg, rgba(57, 135, 229, .3), rgba(57, 135, 229, .1));
  transition: width .4s ease;
}
.build-bar span { position: relative; }

/* ── Каркас ───────────────────────────────────────────────────────────────── */
.shell { display: grid; grid-template-columns: 208px minmax(0, 1fr); gap: 0; }

.rail {
  position: sticky; top: 63px; align-self: start;
  height: calc(100vh - 63px);
  padding: 18px 12px; display: flex; flex-direction: column; gap: 3px;
  border-right: 1px solid var(--border);
}
.rail a {
  display: flex; align-items: center; gap: 11px;
  padding: 9px 12px; border-radius: 10px;
  color: var(--text-2); font-weight: 500;
  transition: background .15s, color .15s;
}
.rail a:hover { background: var(--surface-1); color: var(--text); }
.rail a.active { background: var(--surface-2); color: var(--text); }
.rail a.active svg { color: var(--series-1); }
.rail svg { flex: none; color: var(--muted); transition: color .15s; }
.rail a:hover svg { color: var(--text-2); }

.view { padding: 26px 30px 60px; min-width: 0; }

.page-head { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.page-head h1 { margin: 0; font-size: 23px; font-weight: 600; letter-spacing: -.4px; }
.page-head p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

/* ── Карточки ─────────────────────────────────────────────────────────────── */
.card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
}
.card-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
.card-head h2 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -.1px; }
.card-head .sub { color: var(--muted); font-size: 12px; margin-left: auto; }

.grid { display: grid; gap: 16px; align-items: start; }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-7-5 { grid-template-columns: 7fr 5fr; }
.col { display: grid; gap: 16px; align-content: start; min-width: 0; }

/* Плитки-метрики */
.tile { position: relative; overflow: hidden; }
.tile .label { color: var(--muted); font-size: 12px; font-weight: 500; }
.tile .value { margin-top: 6px; font-size: 27px; font-weight: 600; letter-spacing: -.8px; }
.tile .foot { margin-top: 6px; font-size: 12px; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
.tile .glow {
  position: absolute; right: -30px; top: -40px; width: 120px; height: 120px;
  border-radius: 50%; background: radial-gradient(circle, rgba(57,135,229,.16), transparent 68%);
  pointer-events: none;
}

.delta { display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; font-weight: 500; }
.delta--up { color: var(--good-ink); }
.delta--down { color: var(--critical-ink); }
.delta--flat { color: var(--muted); }

/* ── Фильтры ──────────────────────────────────────────────────────────────── */
.filters {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-bottom: 16px;
}
.filters select, .filters input[type=text] {
  height: 34px; padding: 0 10px; border-radius: 9px;
  background: var(--surface-1); color: var(--text);
  border: 1px solid var(--border); outline: none;
}
.filters select:focus, .filters input:focus { border-color: var(--series-1); }
.chips { display: inline-flex; gap: 5px; background: var(--surface-1); padding: 3px; border-radius: 10px; border: 1px solid var(--border); }
.chip {
  padding: 5px 11px; border-radius: 7px; border: 0; background: none;
  color: var(--text-2); cursor: pointer; font-size: 13px; transition: background .15s, color .15s;
}
.chip:hover { color: var(--text); }
.chip.active { background: var(--surface-3); color: var(--text); }
.filters .spacer { margin-left: auto; color: var(--muted); font-size: 12px; }

/* ── Таблица ──────────────────────────────────────────────────────────────── */
.table-wrap { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--surface-1); }
.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 780px; }
thead th {
  position: sticky; top: 0; z-index: 2;
  padding: 11px 14px; text-align: left; font-size: 11.5px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .5px; color: var(--muted);
  background: var(--surface-2); border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
thead th.sortable { cursor: pointer; user-select: none; }
thead th.sortable:hover { color: var(--text-2); }
thead th .arrow { opacity: .45; font-size: 10px; }
thead th.sorted { color: var(--text); }
thead th.sorted .arrow { opacity: 1; color: var(--series-1); }
tbody td { padding: 10px 14px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr { cursor: pointer; transition: background .12s; }
tbody tr:hover { background: var(--surface-2); }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.rank { color: var(--muted); font-variant-numeric: tabular-nums; width: 44px; }

.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.avatar {
  flex: none; width: 32px; height: 32px; border-radius: 9px;
  display: grid; place-items: center; font-size: 11.5px; font-weight: 600;
  background: var(--surface-3); color: var(--text-2); letter-spacing: .3px;
  overflow: hidden;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.who-main { min-width: 0; }
.who-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who-sub { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.tag {
  display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11.5px;
  background: var(--surface-3); color: var(--text-2); white-space: nowrap;
}
.tag--GK { background: rgba(250,178,25,.14); color: #f0c04a; }
.tag--DF { background: rgba(57,135,229,.14); color: #7bb0ee; }
.tag--MF { background: rgba(25,158,112,.16); color: #4dc79b; }
.tag--FW { background: rgba(217,89,38,.15); color: #e88a5e; }

.money { font-variant-numeric: tabular-nums; font-weight: 500; }

.pager { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12.5px; }
.pager .btn { height: 28px; }

/* ── Графики ──────────────────────────────────────────────────────────────── */
.chart { width: 100%; display: block; }
.chart--area { height: auto; }
.chart text { font-family: var(--font); }
.axis-label { fill: var(--muted); font-size: 11px; }
.grid-line { stroke: var(--grid); stroke-width: 1; }
.baseline { stroke: var(--axis); stroke-width: 1; }
.pt-hit { cursor: crosshair; }

/* Горизонтальные бары (HTML) */
.hbar { display: grid; gap: 9px; }
.hbar-row {
  display: grid; grid-template-columns: minmax(72px, 148px) minmax(0, 1fr) 78px;
  align-items: center; gap: 12px; cursor: pointer; border-radius: 7px;
  padding: 2px 4px; margin: -2px -4px; transition: background .12s;
}
.hbar-row:hover { background: var(--surface-2); }
.hbar-label {
  color: var(--text-2); font-size: 12.5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.hbar-track { height: 16px; border-radius: 3px; background: var(--grid); overflow: hidden; }
.hbar-fill { height: 100%; border-radius: 0 4px 4px 0; transition: width .5s cubic-bezier(.2,.7,.3,1); }
.hbar-row:hover .hbar-fill { filter: brightness(1.15); }
.hbar-value {
  text-align: right; color: var(--text-2); font-size: 12px;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}

/* Диверджентные бары (HTML) */
.dv { display: grid; gap: 10px; }
.dv-row {
  display: grid; grid-template-columns: minmax(72px, 132px) 1fr 1px 1fr;
  align-items: center; gap: 0 10px; cursor: pointer; border-radius: 7px;
  padding: 3px 4px; margin: -3px -4px; transition: background .12s;
}
.dv-row:hover { background: var(--surface-2); }
.dv-label {
  color: var(--text-2); font-size: 12.5px; padding-right: 8px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.dv-side { display: flex; height: 14px; align-items: center; }
.dv-side--l { justify-content: flex-end; }
.dv-axis { width: 1px; height: 22px; background: var(--axis); }
.dv-bar { display: block; height: 100%; min-width: 2px; border-radius: 3px; }
.dv-side--l .dv-bar { border-radius: 4px 1px 1px 4px; margin-right: 2px; }
.dv-side--r .dv-bar { border-radius: 1px 4px 4px 1px; margin-left: 2px; }

.legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); font-size: 12px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

.tooltip {
  position: fixed; z-index: 100; pointer-events: none;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 9px; padding: 8px 10px; box-shadow: var(--shadow);
  font-size: 12.5px; max-width: 260px;
}
.tooltip b { display: block; margin-bottom: 3px; font-weight: 600; }
.tooltip .tt-row { color: var(--text-2); font-variant-numeric: tabular-nums; }

/* ── Лента трансферов ─────────────────────────────────────────────────────── */
.feed { display: grid; gap: 10px; }
.transfer {
  display: grid; grid-template-columns: minmax(150px, 232px) minmax(0, 1fr) 128px 112px;
  align-items: center; gap: 14px;
  padding: 13px 16px; background: var(--surface-1);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  cursor: pointer; transition: border-color .15s, background .15s, transform .15s;
}
.transfer:hover { background: var(--surface-2); border-color: rgba(57,135,229,.35); transform: translateY(-1px); }

/* Узкий вариант для боковой карточки: маршрут уходит на вторую строку */
.transfer--compact {
  grid-template-columns: minmax(0, 1fr) auto;
  row-gap: 8px; column-gap: 12px; align-items: center;
}
.transfer--riser { grid-template-columns: minmax(0, 1fr) 112px 82px; }
.transfer--compact .fee { grid-column: 2; grid-row: 1; }
.transfer--compact .route { grid-column: 1; grid-row: 2; font-size: 12.5px; }
.transfer--compact .meta { grid-column: 2; grid-row: 2; }
.route { display: flex; align-items: center; gap: 10px; min-width: 0; color: var(--text-2); }
.route .club { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.route .club.to { color: var(--text); font-weight: 500; }
.route .arr { flex: none; color: var(--series-1); }
.fee { text-align: right; }
.fee .amt { font-weight: 600; font-variant-numeric: tabular-nums; }
.fee .cap { color: var(--muted); font-size: 11.5px; }
.meta { text-align: right; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 500;
}
.badge--upcoming { background: rgba(250,178,25,.14); color: #f0c04a; }
.badge--free { background: rgba(25,158,112,.16); color: #4dc79b; }
.badge--loan { background: rgba(57,135,229,.14); color: #7bb0ee; }

/* ── Клубы ────────────────────────────────────────────────────────────────── */
.club-card { display: flex; flex-direction: column; gap: 12px; cursor: default; }
.club-top { display: flex; align-items: center; gap: 11px; }
.club-top .avatar { width: 38px; height: 38px; border-radius: 10px; background: var(--surface-3); }
.club-name { font-weight: 600; }
.club-league { color: var(--muted); font-size: 12px; }
.club-value { font-size: 21px; font-weight: 600; letter-spacing: -.5px; }
.bar-track { height: 6px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; background: var(--series-1); }
.club-stats { display: flex; gap: 16px; color: var(--text-2); font-size: 12px; }
.club-stats b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
.club-stats .delta { font-size: 12px; }

/* ── Панель игрока ────────────────────────────────────────────────────────── */
.drawer { position: fixed; inset: 0; z-index: 90; }
.drawer-backdrop { position: absolute; inset: 0; background: rgba(5, 7, 11, .62); backdrop-filter: blur(3px); }
.drawer-panel {
  position: absolute; top: 0; right: 0; bottom: 0; width: min(560px, 100%);
  background: var(--surface-1); border-left: 1px solid var(--border);
  box-shadow: -24px 0 60px rgba(0,0,0,.5);
  overflow-y: auto; padding: 22px 24px 40px;
  animation: slide-in .22s cubic-bezier(.2,.7,.3,1);
}
@keyframes slide-in { from { transform: translateX(24px); opacity: .4; } to { transform: none; opacity: 1; } }
.drawer-close {
  position: absolute; top: 16px; right: 18px; width: 30px; height: 30px;
  border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2);
  color: var(--text-2); cursor: pointer;
}
.drawer-close:hover { color: var(--text); }

.p-head { display: flex; gap: 14px; align-items: center; margin-bottom: 18px; padding-right: 40px; }
.p-head .avatar { width: 58px; height: 58px; border-radius: 14px; font-size: 17px; }
.p-head h2 { margin: 0 0 3px; font-size: 20px; font-weight: 600; letter-spacing: -.4px; }
.p-head .p-sub { color: var(--muted); font-size: 13px; }

.p-hero { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 16px; }
.p-hero .big { font-size: 32px; font-weight: 600; letter-spacing: -1px; }

.p-facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0 20px; }
.p-fact { background: var(--surface-2); border-radius: var(--radius-sm); padding: 10px 12px; }
.p-fact .k { color: var(--muted); font-size: 11.5px; }
.p-fact .v { margin-top: 2px; font-weight: 500; font-variant-numeric: tabular-nums; }

.p-section-title { font-size: 13px; font-weight: 600; margin: 22px 0 10px; }

.timeline { display: grid; gap: 8px; }
.tl-item {
  display: grid; grid-template-columns: 74px minmax(0,1fr) auto; gap: 12px;
  align-items: center; padding: 10px 12px;
  background: var(--surface-2); border-radius: var(--radius-sm);
}
.tl-date { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

.note {
  display: flex; gap: 10px; padding: 12px 14px; border-radius: var(--radius-sm);
  background: rgba(250, 178, 25, .07); border: 1px solid rgba(250, 178, 25, .22);

    transfers: { comp: 'all', min: 0, sort: 'date' },
    clubs: { comp: 'all' },
  },
};

const PAGE_SIZE = 40;
const COLORS = {
  s1: '#3987e5', s2: '#d95926', s3: '#199e70',
  good: '#0ca30c', goodInk: '#46d16d', crit: '#d03b3b', critInk: '#f07070',
  grid: '#232a36', axis: '#2f3644', text2: '#a8b1c1', muted: '#717d90',

};

/* ── Утилиты ───────────────────────────────────────────────────────────── */

const $ = (sel, root = document) => root.querySelector(sel);
const el = (tag, attrs = {}, html = '') => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (html) n.innerHTML = html;
  return n;
};
const esc = (s) =>
  String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function fmtMoney(v, { compact = true, sign = false } = {}) {
  if (v === null || v === undefined || Number.isNaN(v)) return '—';
  const s = v < 0 ? '−' : sign && v > 0 ? '+' : '';
  const a = Math.abs(v);
  if (!compact) return s + '€' + a.toLocaleString('ru-RU');
  if (a >= 1e9) return `${s}€${(a / 1e9).toLocaleString('ru-RU', { maximumFractionDigits: 2 })} млрд`;
  if (a >= 1e6) return `${s}€${(a / 1e6).toLocaleString('ru-RU', { maximumFractionDigits: a < 1e7 ? 1 : 0 })} млн`;
  if (a >= 1e3) return `${s}€${Math.round(a / 1e3)} тыс.`;
  return s + '€' + a;
}

function fmtDate(d) {
  if (!d) return '—';
  const dt = new Date(d);
  if (Number.isNaN(+dt)) return d;
  return dt.toLocaleDateString('ru-RU', { day: '2-digit', month: 'short', year: '2-digit' });
}

/** Полный год — для дат контрактов, где «30 г.» читается двусмысленно. */
function fmtDateFull(d) {
  if (!d) return '—';
  const dt = new Date(d);
  if (Number.isNaN(+dt)) return d;
  return dt.toLocaleDateString('ru-RU', { day: '2-digit', month: 'short', year: 'numeric' });
}

const FOOT_RU = { right: 'правая', left: 'левая', both: 'обе' };

function fmtDateTime(d) {
  if (!d) return '—';
  const dt = new Date(d);
  if (Number.isNaN(+dt)) return d;
  return dt.toLocaleString('ru-RU', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
}

const initials = (name) =>
  String(name || '?')
    .split(/\s+/)
    .slice(0, 2)
    .map((w) => w[0] || '')
    .join('')
    .toUpperCase();

function deltaHtml(cur, prev) {
  if (!Number.isFinite(cur) || !Number.isFinite(prev) || prev === 0) {
    return '<span class="delta delta--flat">—</span>';
  }
  const diff = cur - prev;
  const pct = (diff / prev) * 100;
  if (Math.abs(pct) < 0.5) return '<span class="delta delta--flat">0%</span>';
  const up = diff > 0;
  return `<span class="delta delta--${up ? 'up' : 'down'}">${up ? '▲' : '▼'} ${Math.abs(pct).toFixed(
    Math.abs(pct) < 10 ? 1 : 0,
  )}%</span>`;
}

const SEED = window.__SEED__;

/** Превью: вместо сервера отвечает встроенный офлайн-датасет. */
async function api(path) {
  const u = new URL(path, 'http://preview');
  const p = u.pathname;

  if (p === '/api/dataset') return { ...SEED, version: 0 };

  if (p === '/api/status') {
    return {
      source: 'seed', status: 'idle', version: 0,
      progress: { done: 1, total: 1, step: 'Готово' },
      builtAt: SEED.generatedAt, error: null, upstream: null,
      generatedAt: SEED.generatedAt, note: SEED.note,
      counts: {
        players: SEED.players.length, clubs: SEED.clubs.length,
        transfers: SEED.transfers.length, competitions: SEED.competitions.length,
      },
      config: { apiUrl: null, competitions: SEED.competitions.map((c) => c.id), refreshMinutes: 0 },
    };
  }

  const pm = p.match(/^\/api\/players\/(.+)$/);
  if (pm) {
    const id = decodeURIComponent(pm[1]);
    const player = SEED.players.find((x) => x.id === id) || null;
    return {
      source: 'seed',
      player,
      history: player ? player.history : [],
      transfers: SEED.transfers.filter((t) => t.playerId === id),
      ranking: null,
    };
  }

  if (p === '/api/search') {
    const q = (u.searchParams.get('q') || '').trim().toLowerCase();
    return {
      source: 'local',
      results: SEED.players
        .filter((x) => x.name.toLowerCase().includes(q))
        .slice(0, 8)
        .map((x) => ({ id: x.id, name: x.name, club: x.clubName, marketValue: x.marketValue, position: x.position })),
    };
  }

  throw new Error('404');
}

/* ── Тултип ────────────────────────────────────────────────────────────── */

const tip = $('#tooltip');
function showTip(html, x, y) {
  tip.innerHTML = html;
  tip.hidden = false;
  const r = tip.getBoundingClientRect();
  let left = x + 14;
  let top = y - r.height - 12;
  if (left + r.width > innerWidth - 8) left = x - r.width - 14;
  if (top < 8) top = y + 18;
  tip.style.left = `${Math.max(8, left)}px`;
  tip.style.top = `${top}px`;
}
const hideTip = () => { tip.hidden = true; };

/* ── Графики ───────────────────────────────────────────────────────────── */

/**
 * Горизонтальные бары — сравнение величин. Одна серия → легенда не нужна
 * (заголовок называет её), значения подписаны напрямую у конца марки.
 * Свёрстано на HTML/CSS: текст не искажается при растягивании и остаётся
 * доступным для поиска и скринридера.
 */
function hBarChart(rows, { color = COLORS.s1, valueFmt = fmtMoney } = {}) {
  if (!rows.length) return '<div class="empty">Нет данных</div>';
  const max = Math.max(...rows.map((r) => r.value)) || 1;
  return `<div class="hbar">${rows
    .map((r) => {
      const w = Math.max(0.8, (r.value / max) * 100);
      const tipTxt = `${esc(r.label)}|${valueFmt(r.value)}${r.sub ? '|' + esc(r.sub) : ''}`;
      return `<div class="hbar-row" data-tip="${tipTxt}" ${r.id ? `data-player="${esc(r.id)}"` : ''}>
        <div class="hbar-label" title="${esc(r.label)}">${esc(r.label)}</div>
        <div class="hbar-track"><div class="hbar-fill" style="width:${w}%;background:${color}"></div></div>
        <div class="hbar-value">${valueFmt(r.value)}</div>
      </div>`;
    })
    .join('')}</div>`;
}

/**
 * Диверджентные бары — полярность (потратили ↔ заработали).
 * Пара blue↔red с нейтральной осью посередине; две серии → есть легенда.
 */
function divergingChart(rows) {
  if (!rows.length) return '<div class="empty">Нет данных</div>';
  const max = Math.max(...rows.flatMap((r) => [r.spent || 0, r.income || 0])) || 1;
  return `<div class="dv">${rows
    .map(
      (r) => `<div class="dv-row" data-tip="${esc(r.label)}|Потрачено: ${fmtMoney(r.spent)}|Заработано: ${fmtMoney(r.income)}">
      <div class="dv-label">${esc(r.label)}</div>
      <div class="dv-side dv-side--l"><span class="dv-bar" style="width:${((r.spent || 0) / max) * 100}%;background:${COLORS.crit}"></span></div>
      <div class="dv-axis"></div>
      <div class="dv-side dv-side--r"><span class="dv-bar" style="width:${((r.income || 0) / max) * 100}%;background:${COLORS.s1}"></span></div>
    </div>`,
    )
    .join('')}</div>
  <div class="legend">
    <span><i style="background:${COLORS.crit}"></i>Потрачено</span>
    <span><i style="background:${COLORS.s1}"></i>Заработано</span>
  </div>`;
}

/**
 * Линия — динамика стоимости. Одна серия (заголовок её называет → легенда не нужна),
 * 2px линия, маркер на последней точке, перекрестие с тултипом по наведению.
 * База НЕ нулевая — поэтому заливки под линией нет и обе крайние отметки оси
 * подписаны явно: усечённая шкала допустима для линии, но не для площади.
 */
function lineChart(points, { height = 190 } = {}) {
  if (points.length < 2) return '<div class="empty">Недостаточно точек истории</div>';
  const W = 520;
  const H = height;
  const pad = { l: 8, r: 8, t: 16, b: 24 };
  const vals = points.map((p) => p.value);
  const maxRaw = Math.max(...vals);
  const minRaw = Math.min(...vals);
  const cushion = (maxRaw - minRaw) * 0.18 || maxRaw * 0.1 || 1;
  const maxV = maxRaw + cushion;
  const minV = Math.max(0, minRaw - cushion);
  const span = maxV - minV || 1;
  const x = (i) => pad.l + (i / (points.length - 1)) * (W - pad.l - pad.r);
  const y = (v) => pad.t + (1 - (v - minV) / span) * (H - pad.t - pad.b);

  const line = points.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join('');

  // Подписи оси с «гало» под цвет поверхности, чтобы линия не перечёркивала текст.
  const ticks = [maxRaw, (maxRaw + minRaw) / 2, minRaw].map(
    (v) => `<line class="grid-line" x1="${pad.l}" y1="${y(v)}" x2="${W - pad.r}" y2="${y(v)}"></line>
            <text class="axis-label" x="${pad.l}" y="${y(v) - 5}"
                  stroke="${COLORS.surface}" stroke-width="3.5" paint-order="stroke">${fmtMoney(v)}</text>`,
  ).join('');

  const hits = points
    .map((p, i) => {
      const w = (W - pad.l - pad.r) / points.length;
      return `<rect class="pt-hit" x="${(x(i) - w / 2).toFixed(1)}" y="${pad.t}" width="${w.toFixed(1)}"
                height="${H - pad.t - pad.b}" fill="transparent"
                data-i="${i}" data-cx="${x(i).toFixed(1)}" data-cy="${y(p.value).toFixed(1)}"
                data-tip="${esc(fmtDate(p.date))}|${fmtMoney(p.value)}${p.clubName ? '|' + esc(p.clubName) : ''}"></rect>`;
    })
    .join('');

  const first = points[0];
  const last = points[points.length - 1];

  return `
  <svg class="chart chart--area" viewBox="0 0 ${W} ${H}" role="img" data-chart="line"
       preserveAspectRatio="xMidYMid meet">
    ${ticks}
    <path d="${line}" fill="none" stroke="${COLORS.s1}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path>
    <circle cx="${x(points.length - 1)}" cy="${y(last.value)}" r="4.5" fill="${COLORS.s1}" stroke="${COLORS.surface}" stroke-width="2"></circle>
    <line class="crosshair" x1="0" y1="${pad.t}" x2="0" y2="${H - pad.b}" stroke="${COLORS.axis}" stroke-width="1" opacity="0"></line>
    <circle class="focus-dot" r="5" fill="${COLORS.s1}" stroke="${COLORS.surface}" stroke-width="2" opacity="0"></circle>
    ${hits}
    <text class="axis-label" x="${pad.l}" y="${H - 6}">${esc(fmtDate(first.date))}</text>
    <text class="axis-label" x="${W - pad.r}" y="${H - 6}" text-anchor="end">${esc(fmtDate(last.date))}</text>
  </svg>`;
}

function viewOverview() {
  const { players, clubs, competitions, transfers } = S.data;
  const totalValue = clubs.reduce((s, c) => s + (c.totalValue || 0), 0);
  const window26 = transfers.filter((t) => Number.isFinite(t.fee) && t.fee > 0);
  const feeSum = window26.reduce((s, t) => s + t.fee, 0);
  const top = players[0];
  const risers = players
    .filter((p) => Number.isFinite(p.previousValue) && Number.isFinite(p.marketValue) && p.previousValue > 0)
    .map((p) => ({ ...p, pct: ((p.marketValue - p.previousValue) / p.previousValue) * 100 }))
    .sort((a, b) => b.pct - a.pct)
    .slice(0, 6);

  const topRows = players.slice(0, 10).map((p) => ({
    id: p.id, label: p.name, value: p.marketValue || 0, sub: p.clubName,
  }));

  const bigDeals = [...transfers]
    .filter((t) => Number.isFinite(t.fee))
    .sort((a, b) => b.fee - a.fee)
    .slice(0, 6);

  const leagueRows = competitions
    .filter((c) => c.spent || c.income)
    .sort((a, b) => (b.spent + b.income) - (a.spent + a.income))
    .slice(0, 6);

  return `
  ${S.data.source === 'seed' ? noteBlock() : ''}
  <div class="page-head">
    <div>
      <h1>Обзор рынка</h1>

  <div class="grid grid-4" style="margin-bottom:16px">
    ${tile('Суммарная стоимость составов', fmtMoney(totalValue), `${clubs.length} клубов в выборке`)}
    ${tile('Трансферов в ленте', String(transfers.length), `с суммой: ${window26.length}`)}
    ${tile('Сумма сделок', fmtMoney(feeSum), 'по сделкам с раскрытой суммой')}
    ${tile(
      'Самый дорогой игрок',
      top ? fmtMoney(top.marketValue) : '—',
      top ? `${esc(top.name)} · ${esc(top.clubName)}` : '',
    )}
  </div>

  <div class="grid grid-7-5">
    <div class="col">
      <div class="card">
        <div class="card-head"><h2>Топ-10 по рыночной стоимости</h2><span class="sub">клик — карточка игрока</span></div>
        ${hBarChart(topRows)}
      </div>
      <div class="card">
        <div class="card-head"><h2>Баланс трансферов по лигам</h2></div>
        ${divergingChart(leagueRows.map((c) => ({ label: c.name, spent: c.spent || 0, income: c.income || 0 })))}
      </div>
    </div>

    <div class="col">
      <div class="card">
        <div class="card-head"><h2>Крупнейшие сделки</h2></div>
        <div class="feed">
          ${bigDeals.length ? bigDeals.map((t) => transferRow(t, true)).join('') : '<div class="empty">Нет сделок с раскрытой суммой</div>'}
        </div>
      </div>
      <div class="card">
        <div class="card-head"><h2>Рост стоимости</h2><span class="sub">к предыдущей оценке</span></div>
        ${
          risers.length
            ? `<div class="feed">${risers

          <div class="transfer transfer--riser" data-player="${esc(p.id)}">
            <div class="who">${avatar(p)}<div class="who-main"><div class="who-name">${esc(p.name)}</div>
              <div class="who-sub">${esc(p.clubName)}</div></div></div>
            <div class="fee"><div class="amt">${fmtMoney(p.marketValue)}</div>

        }
      </div>

}

const ARROW = `<svg class="arr" viewBox="0 0 20 12" width="20" height="11" aria-hidden="true"><path d="M1 6h16m0 0l-4.5-4.5M17 6l-4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

/**
 * @param {object} t     трансфер
 * @param {boolean} compact  узкий вариант для боковой карточки: маршрут переносится
 *                           на вторую строку, чтобы названия клубов не схлопывались
 */
function transferRow(t, compact = false) {
  const badge = t.upcoming
    ? '<span class="badge badge--upcoming">Ожидается</span>'
    : t.fee === 0
      ? '<span class="badge badge--free">Свободный агент</span>'
      : '';
  const fee = t.fee === null || t.fee === undefined ? '—' : fmtMoney(t.fee);
  const est = Number.isFinite(t.marketValue) ? `оценка ${fmtMoney(t.marketValue)}` : '';
  return `
  <div class="transfer${compact ? ' transfer--compact' : ''}" ${t.playerId ? `data-player="${esc(t.playerId)}"` : ''}>
    <div class="who">${avatar({ name: t.playerName })}<div class="who-main">
      <div class="who-name">${esc(t.playerName)}</div>
      <div class="who-sub">${esc(t.position || '')}${t.age ? ` · ${t.age} лет` : ''}</div>
    </div></div>
    <div class="route">
      <span class="club">${esc(t.from.name)}</span>${ARROW}<span class="club to">${esc(t.to.name)}</span>
    </div>
    <div class="fee">
      <div class="amt">${fee}</div>
      ${est ? `<div class="cap">${est}</div>` : ''}
    </div>
    <div class="meta">${badge || fmtDate(t.date)}</div>
  </div>`;
}

function viewTransfers() {
  const f = S.filters.transfers;
  let rows = S.data.transfers.slice();
  if (f.comp !== 'all') {
    const ids = new Set(S.data.clubs.filter((c) => c.competitionId === f.comp).map((c) => c.name));
    rows = rows.filter((t) => ids.has(t.to.name) || ids.has(t.from.name));
  }
  if (f.min) rows = rows.filter((t) => (t.fee || 0) >= f.min);
  rows.sort((a, b) => (f.sort === 'fee' ? (b.fee || 0) - (a.fee || 0) : (b.date || '').localeCompare(a.date || '')));

  const sum = rows.reduce((s, t) => s + (t.fee || 0), 0);

  return `
  ${S.data.source === 'seed' ? noteBlock() : ''}
  <div class="page-head">
    <div><h1>Лента трансферов</h1><p>Переходы игроков из отслеживаемых лиг</p></div>
  </div>

  <div class="grid grid-3" style="margin-bottom:18px">
    ${tile('Сделок в выборке', String(rows.length))}
    ${tile('Общая сумма', fmtMoney(sum))}
    ${tile('Средняя сумма', fmtMoney(rows.filter((t) => t.fee).length ? sum / rows.filter((t) => t.fee).length : 0))}
  </div>

  <div class="filters">
    <select data-tfilter="comp">
      <option value="all">Все лиги</option>
      ${S.data.competitions.map((c) => `<option value="${esc(c.id)}" ${f.comp === c.id ? 'selected' : ''}>${esc(c.flag || '')} ${esc(c.name)}</option>`).join('')}
    </select>
    <select data-tfilter="min">
      <option value="0">Любая сумма</option>
      <option value="10000000" ${f.min == 10000000 ? 'selected' : ''}>от €10 млн</option>
      <option value="30000000" ${f.min == 30000000 ? 'selected' : ''}>от €30 млн</option>
      <option value="60000000" ${f.min == 60000000 ? 'selected' : ''}>от €60 млн</option>
    </select>
    <div class="chips" data-tsort-group>
      <button class="chip ${f.sort === 'date' ? 'active' : ''}" data-tsort="date">По дате</button>
      <button class="chip ${f.sort === 'fee' ? 'active' : ''}" data-tsort="fee">По сумме</button>
    </div>
  </div>

  <div class="feed">${rows.length ? rows.map(transferRow).join('') : '<div class="card"><div class="empty">Трансферов не найдено</div></div>'}</div>
  ${footnote()}`;
}

function viewClubs() {
  const f = S.filters.clubs;
  let clubs = S.data.clubs.slice();
  if (f.comp !== 'all') clubs = clubs.filter((c) => c.competitionId === f.comp);
  const max = Math.max(...clubs.map((c) => c.totalValue || 0), 1);

  return `
  ${S.data.source === 'seed' ? noteBlock() : ''}
  <div class="page-head"><div><h1>Клубы</h1><p>Стоимость составов и баланс трансферного окна</p></div></div>

  <div class="filters">
    <select data-cfilter="comp">
      <option value="all">Все лиги</option>
      ${S.data.competitions.map((c) => `<option value="${esc(c.id)}" ${f.comp === c.id ? 'selected' : ''}>${esc(c.flag || '')} ${esc(c.name)}</option>`).join('')}
    </select>
    <span class="spacer">${clubs.length} клубов</span>
  </div>

  <div class="grid grid-3">
    ${clubs
      .map(
        (c) => `
      <div class="card club-card">
        <div class="club-top">
          ${c.image ? `<span class="avatar"><img src="${esc(c.image)}" alt="" loading="lazy" onerror="this.remove()"></span>` : `<span class="avatar">${esc(initials(c.name))}</span>`}
          <div><div class="club-name">${esc(c.name)}</div><div class="club-league">${esc(c.competitionName)}</div></div>
        </div>
        <div>
          <div class="club-value">${fmtMoney(c.totalValue)}</div>
          <div class="bar-track" style="margin-top:8px"><div class="bar-fill" style="width:${((c.totalValue || 0) / max) * 100}%"></div></div>
        </div>
        <div class="club-stats">
          <span>Состав <b>${c.squadSize ?? '—'}</b></span>
          <span>Ср. возраст <b>${c.avgAge ?? '—'}</b></span>
          <span>Баланс ${
            Number.isFinite(c.balance)
              ? `<span class="delta delta--${c.balance >= 0 ? 'up' : 'down'}">${fmtMoney(c.balance, { sign: true })}</span>`
              : '<b>—</b>'
          }</span>
        </div>
      </div>`,
      )
      .join('')}
  </div>
  ${footnote()}`;
}

function viewLeagues() {
  const comps = S.data.competitions.slice().sort((a, b) => (b.totalValue || 0) - (a.totalValue || 0));
  const rows = comps.map((c) => ({ label: c.name, value: c.totalValue || 0 }));

  return `
  ${S.data.source === 'seed' ? noteBlock() : ''}
  <div class="page-head"><div><h1>Лиги</h1><p>Суммарная стоимость составов и трансферный баланс</p></div></div>

  <div class="grid grid-2" style="margin-bottom:16px">
    <div class="card">
      <div class="card-head"><h2>Стоимость лиг</h2><span class="sub">сумма по клубам выборки</span></div>
      ${hBarChart(rows, { labelW: 150 })}
    </div>
    <div class="card">
      <div class="card-head"><h2>Потрачено / заработано</h2></div>
      ${divergingChart(comps.map((c) => ({ label: c.name, spent: c.spent || 0, income: c.income || 0 })))}
    </div>
  </div>

  <div class="table-wrap"><div class="table-scroll"><table>
    <thead><tr><th>Лига</th><th>Страна</th><th class="num">Клубов</th><th class="num">Стоимость</th>
      <th class="num">Потрачено</th><th class="num">Заработано</th><th class="num">Баланс</th></tr></thead>
    <tbody>${comps
      .map((c) => {
        const bal = (c.income || 0) - (c.spent || 0);
        return `<tr style="cursor:default">
        <td><b>${esc(c.flag || '')} ${esc(c.name)}</b></td>
        <td style="color:var(--text-2)">${esc(c.country)}</td>
        <td class="num">${c.clubs}</td>
        <td class="num money">${fmtMoney(c.totalValue)}</td>
        <td class="num money">${fmtMoney(c.spent)}</td>
        <td class="num money">${fmtMoney(c.income)}</td>
        <td class="num"><span class="delta delta--${bal >= 0 ? 'up' : 'down'}">${fmtMoney(bal, { sign: true })}</span></td>
      </tr>`;
      })
      .join('')}</tbody>
  </table></div></div>
  ${footnote()}`;
}

function noteBlock() {
  return `<div class="note">
    <span>⚠</span>
    <div><b>Интерактивное превью.</b> Здесь встроен офлайн-срез из открытых публикаций на 25.08.2026;
    помесячная история стоимости в нём синтезирована. Живые данные Transfermarkt подключаются
    только в локальной версии — она ходит в self-hosted API, а опубликованная страница внешние
    запросы делать не может. Всё остальное — фильтры, сортировка, поиск, карточки игроков — рабочее.</div>
  </div>`;
}

function footnote() {
  const s = S.status;
  return `<div class="footnote">
    Источник: ${
      S.data.source === 'live'
        ? `self-hosted <a class="ext-link" href="https://github.com/felipeall/transfermarkt-api" target="_blank" rel="noopener">transfermarkt-api</a> → данные Transfermarkt`
        : 'офлайн-срез из открытых публикаций'
    }.
    Обновлено: ${fmtDateTime(S.data.generatedAt)}${s?.counts ? ` · ${s.counts.players} игроков, ${s.counts.clubs} клубов` : ''}.
  </div>`;
}

/* ── Карточка игрока ───────────────────────────────────────────────────── */

async function openPlayer(id) {
  const drawer = $('#drawer');
  const body = $('#drawer-body');
  drawer.hidden = false;
  document.body.style.overflow = 'hidden';
  body.innerHTML = `
    <div class="p-head"><div class="skeleton" style="width:58px;height:58px;border-radius:14px"></div>
      <div style="flex:1"><div class="skeleton" style="height:20px;width:60%"></div>
      <div class="skeleton" style="height:14px;width:40%;margin-top:8px"></div></div></div>
    <div class="skeleton" style="height:190px;margin-top:20px"></div>`;

  let d;
  try {
    d = await api(`/api/players/${encodeURIComponent(id)}`);
  } catch {
    body.innerHTML = '<div class="empty">Не удалось загрузить карточку игрока</div>';
    return;
  }
  const p = d.player;
  if (!p) {
    body.innerHTML = '<div class="empty">Игрок не найден</div>';
    return;
  }
  const hist = (d.history || []).filter((h) => Number.isFinite(h.value));
  const peak = hist.length ? Math.max(...hist.map((h) => h.value)) : null;
  // Дельта считается по журналу сервера (та же цифра, что в таблице рейтинга);
  // история — только запасной источник.
  const prev = Number.isFinite(p.previousValue)
    ? p.previousValue
    : hist.length > 1
      ? hist[hist.length - 2].value
      : null;

  body.innerHTML = `
  <div class="p-head">
    ${avatar(p)}
    <div>
      <h2>${esc(p.name)}</h2>
      <div class="p-sub">${esc(p.clubName)}${p.competitionName && p.competitionName !== '—' ? ' · ' + esc(p.competitionName) : ''}</div>
    </div>
  </div>

  <div class="p-hero">
    <div class="big">${fmtMoney(p.marketValue)}</div>
    <div style="padding-bottom:6px">${deltaHtml(p.marketValue, prev)}</div>
  </div>

  <div class="p-facts">
    <div class="p-fact"><div class="k">Позиция</div><div class="v">${esc(p.position || '—')}</div></div>
    <div class="p-fact"><div class="k">Возраст</div><div class="v">${p.age ?? '—'}</div></div>
    <div class="p-fact"><div class="k">Гражданство</div><div class="v">${esc((p.nationality || []).slice(0, 2).join(', ') || '—')}</div></div>
    <div class="p-fact"><div class="k">Рост</div><div class="v">${p.height ? p.height + ' см' : '—'}</div></div>
    <div class="p-fact"><div class="k">Нога</div><div class="v">${esc(FOOT_RU[p.foot] || p.foot || '—')}</div></div>
    <div class="p-fact"><div class="k">Контракт до</div><div class="v">${fmtDateFull(p.contract)}</div></div>
  </div>

  <div class="p-section-title">Динамика рыночной стоимости</div>
  ${lineChart(hist.map((h) => ({ date: h.date, value: h.value, clubName: h.clubName })))}
  ${peak ? `<div class="footnote" style="margin-top:8px">Пик: ${fmtMoney(peak)}${d.ranking?.Worldwide ? ` · место в мире: ${d.ranking.Worldwide}` : ''}</div>` : ''}

  <div class="p-section-title">История трансферов</div>
  ${
    (d.transfers || []).length
      ? `<div class="timeline">${d.transfers
          .slice(0, 12)
          .map(
            (t) => `<div class="tl-item">
        <div class="tl-date">${esc(t.season || fmtDate(t.date))}</div>
        <div class="route"><span class="club">${esc(t.from.name)}</span>${ARROW}<span class="club to">${esc(t.to.name)}</span></div>
        <div class="money">${t.fee === 0 ? 'свободный' : fmtMoney(t.fee)}</div>
      </div>`,
          )
          .join('')}</div>`
      : '<div class="empty">Нет данных о трансферах</div>'
  }

  ${p.url ? `<div style="margin-top:20px"><a class="ext-link" href="${esc(p.url)}" target="_blank" rel="noopener">Профиль на Transfermarkt ↗</a></div>` : ''}
  ${d.source === 'seed' ? '<div class="footnote">Карточка построена по офлайн-срезу: история стоимости синтезирована.</div>' : ''}`;
}

function closeDrawer() {
  $('#drawer').hidden = true;
  document.body.style.overflow = '';
}

/* ── Фильтрация ────────────────────────────────────────────────────────── */

function filteredPlayers() {
  const f = S.filters.players;
  let rows = S.data.players.slice();
  if (f.comp !== 'all') rows = rows.filter((p) => p.competitionId === f.comp);
  if (f.pos !== 'all') rows = rows.filter((p) => p.positionGroup === f.pos);
  if (f.ageMax !== 'all') rows = rows.filter((p) => Number.isFinite(p.age) && p.age <= Number(f.ageMax));
  if (f.q.trim()) {
    const q = f.q.trim().toLowerCase();
    rows = rows.filter((p) => p.name.toLowerCase().includes(q) || (p.clubName || '').toLowerCase().includes(q));
  }
  const key = f.sort;
  rows.sort((a, b) => {
    const av = a[key], bv = b[key];
    if (typeof av === 'string' || typeof bv === 'string') {
      return String(av || '').localeCompare(String(bv || ''), 'ru') * f.dir * -1;
    }
    return ((bv ?? -Infinity) - (av ?? -Infinity)) * (f.dir < 0 ? 1 : -1);
  });
  return rows;
}

/* ── Роутер ────────────────────────────────────────────────────────────── */

const VIEWS = {
  overview: viewOverview,
  players: viewPlayers,
  transfers: viewTransfers,
  clubs: viewClubs,
  leagues: viewLeagues,
};

function currentView() {
  const name = (location.hash.replace(/^#\//, '') || 'overview').split('?')[0];
  return VIEWS[name] ? name : 'overview';
}

function render() {
  const name = currentView();
  $('#view').innerHTML = VIEWS[name]();
  document.querySelectorAll('.rail a').forEach((a) => a.classList.toggle('active', a.dataset.view === name));
  window.scrollTo({ top: 0 });
}

/* ── События ───────────────────────────────────────────────────────────── */

addEventListener('hashchange', render);

document.addEventListener('click', (e) => {
  const closer = e.target.closest('[data-close]');
  if (closer) return closeDrawer();

  const row = e.target.closest('[data-player]');
  if (row) {
    const id = row.dataset.player;
    if (id) openPlayer(id);
    return;
  }

  const sortTh = e.target.closest('th[data-sort]');
  if (sortTh) {
    const f = S.filters.players;
    const k = sortTh.dataset.sort;
    if (f.sort === k) f.dir *= -1;
    else { f.sort = k; f.dir = -1; }
    f.page = 0;
    return render();
  }

  const pos = e.target.closest('[data-pos]');
  if (pos) { S.filters.players.pos = pos.dataset.pos; S.filters.players.page = 0; return render(); }

  const tsort = e.target.closest('[data-tsort]');
  if (tsort) { S.filters.transfers.sort = tsort.dataset.tsort; return render(); }

  const pg = e.target.closest('[data-page]');
  if (pg && !pg.disabled) {
    S.filters.players.page += pg.dataset.page === 'next' ? 1 : -1;
    return render();
  }
});

document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset.filter) {
    S.filters.players[t.dataset.filter] = t.value;
    S.filters.players.page = 0;
    return render();
  }
  if (t.dataset.tfilter) {
    S.filters.transfers[t.dataset.tfilter] = t.dataset.tfilter === 'min' ? Number(t.value) : t.value;
    return render();
  }
  if (t.dataset.cfilter) { S.filters.clubs[t.dataset.cfilter] = t.value; return render(); }
});

let qTimer;
document.addEventListener('input', (e) => {
  if (e.target.dataset.filter === 'q') {
    clearTimeout(qTimer);
    const v = e.target.value;
    qTimer = setTimeout(() => {
      S.filters.players.q = v;
      S.filters.players.page = 0;
      render();
      const inp = $('input[data-filter="q"]');
      if (inp) { inp.focus(); inp.setSelectionRange(v.length, v.length); }
    }, 220);
  }
});

addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeDrawer(); $('#search-results').hidden = true; }
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); $('#search-input').focus(); }
});

/* Тултипы графиков */
document.addEventListener('mousemove', (e) => {
  const hit = e.target.closest('[data-tip]');
  if (!hit) { hideTip(); clearFocus(); return; }
  const parts = hit.dataset.tip.split('|');
  showTip(`<b>${parts[0]}</b>${parts.slice(1).map((p) => `<div class="tt-row">${p}</div>`).join('')}`, e.clientX, e.clientY);

  if (hit.classList.contains('pt-hit')) {
    const svg = hit.closest('svg');
    const cross = svg.querySelector('.crosshair');
    const dot = svg.querySelector('.focus-dot');
    const cx = hit.dataset.cx, cy = hit.dataset.cy;
    if (cross) { cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.setAttribute('opacity', '.9'); }
    if (dot) { dot.setAttribute('cx', cx); dot.setAttribute('cy', cy); dot.setAttribute('opacity', '1'); }
  } else clearFocus();
});

function clearFocus() {
  document.querySelectorAll('.crosshair, .focus-dot').forEach((n) => n.setAttribute('opacity', '0'));
}

/* Глобальный поиск */
const searchInput = $('#search-input');
const searchBox = $('#search-results');
let sTimer;
searchInput.addEventListener('input', () => {
  clearTimeout(sTimer);
  const q = searchInput.value.trim();
  if (q.length < 2) { searchBox.hidden = true; return; }
  sTimer = setTimeout(async () => {
    try {
      const r = await api(`/api/search?q=${encodeURIComponent(q)}`);
      searchBox.hidden = false;
      searchBox.innerHTML = r.results.length
        ? r.results
            .map(
              (x) => `<button data-player="${esc(x.id)}">
          <span class="avatar">${esc(initials(x.name))}</span>
          <span><span class="sr-name">${esc(x.name)}</span><br><span class="sr-club">${esc(x.club)} · ${esc(x.position)}</span></span>
          <span class="sr-val">${fmtMoney(x.marketValue)}</span></button>`,
            )
            .join('')
        : '<div class="search-empty">Ничего не найдено</div>';
    } catch {
      searchBox.hidden = true;
    }
  }, 280);
});
searchInput.addEventListener('blur', () => setTimeout(() => { searchBox.hidden = true; }, 180));

/* Обновление */

/* ── Статус и загрузка ─────────────────────────────────────────────────── */

function paintStatus(st) {
  const pill = $('#status-pill');
  const text = $('#status-text');
  const bar = $('#build-bar');
  const fill = $('#build-bar-fill');
  const btext = $('#build-bar-text');

  pill.className = 'pill ' + (st.status === 'live' ? 'pill--live' : st.status === 'error' ? 'pill--error' : 'pill--seed');
  text.textContent =
    st.status === 'live' ? 'Live · API' :
    st.status === 'building' ? 'Обновление…' :
    st.status === 'error' ? 'Демо · API недоступен' : 'Демо-данные';
  pill.title = st.error ? `${st.error}` : `Апстрим: ${st.upstream}`;

  if (st.status === 'building') {
    const { done, total, step } = st.progress || {};
    const pct = total ? Math.round((done / total) * 100) : 0;
    bar.hidden = false;
    fill.style.width = `${pct}%`;
    btext.textContent = `${step} — ${done}/${total} (${pct}%)`;
  } else {
    bar.hidden = true;
  }
}

async function loadDataset() {
  const d = await api('/api/dataset');
  S.data = d;
  S.version = d.version;
  render();
}

async function pollStatus() {
  try {
    const st = await api('/api/status');
    S.status = st;
    paintStatus(st);
    if (st.version !== S.version) await loadDataset();
  } catch {
    /* сервер недоступен — оставляем что есть */
  }
}

(async function init() {
  try {
    await loadDataset();
  } catch {
    $('#view').innerHTML = '<div class="empty">Не удалось загрузить данные превью.</div>';
  }
  pollStatus();
})();

</script>
