<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Transfer Tracker — стоимость и трансферы футболистов</title>
<meta name="description" content="Дашборд рыночной стоимости футболистов, ленты трансферов и стоимости составов." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233987e5'/%3E%3Cpath d='M16 7l7 5-2.7 8.3h-8.6L9 12z' fill='%23fff'/%3E%3C/svg%3E" />
</head>
<body>

<header class="topbar">
  <a class="brand" href="#/overview">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 3l7.5 5.4-2.9 8.9H7.4L4.5 8.4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 3v4.2m0 0l3.6 2.6m-3.6-2.6L8.4 9.8m7.2 0l1 3.2m-1-3.2l3.9-1.4M8.4 9.8l-1 3.2m1-3.2L4.5 8.4m2.9 4.6l2.7 2m6.5-2l-2.7 2m-3.8 0l1.5 4.3m2.3-4.3l-1.5 4.3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
    </span>
    <span class="brand-text">Transfer<b>Tracker</b></span>
  </a>

  <div class="search" role="search">
    <svg class="search-ico" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="9" cy="9" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M13.2 13.2L17 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <input id="search-input" type="search" placeholder="Поиск игрока…" autocomplete="off" aria-label="Поиск игрока" />
    <div id="search-results" class="search-results" hidden></div>
  </div>

  <div class="topbar-right">
    <div id="status-pill" class="pill pill--seed" title="Источник данных">
      <span class="dot"></span><span id="status-text">Демо-данные</span>
    </div>
    <button id="refresh-btn" class="btn btn--ghost" title="Обновить данные из API">
      <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><path d="M16 10a6 6 0 1 1-1.8-4.3M16 3v3.2h-3.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Обновить</span>
    </button>
  </div>
</header>

<div id="build-bar" class="build-bar" hidden>
  <div class="build-bar-fill" id="build-bar-fill"></div>
  <span id="build-bar-text">Сборка…</span>
</div>

<div class="shell">
  <nav class="rail" aria-label="Разделы">
    <a href="#/overview" data-view="overview"><svg viewBox="0 0 20 20" width="18" height="18"><rect x="2.5" y="2.5" width="6" height="6" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="11.5" y="2.5" width="6" height="9.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="2.5" y="11.5" width="6" height="6" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="11.5" y="15" width="6" height="2.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span>Обзор</span></a>
    <a href="#/players" data-view="players"><svg viewBox="0 0 20 20" width="18" height="18"><path d="M3 16.5l4-6 3.5 3 6.5-8.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M13.5 5H17v3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Стоимость</span></a>
    <a href="#/transfers" data-view="transfers"><svg viewBox="0 0 20 20" width="18" height="18"><path d="M3 7h11m0 0l-3-3m3 3l-3 3M17 13H6m0 0l3-3m-3 3l3 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Трансферы</span></a>
    <a href="#/clubs" data-view="clubs"><svg viewBox="0 0 20 20" width="18" height="18"><path d="M10 2.5l6 2.2v5.1c0 3.4-2.4 6.4-6 7.7-3.6-1.3-6-4.3-6-7.7V4.7z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span>Клубы</span></a>
    <a href="#/leagues" data-view="leagues"><svg viewBox="0 0 20 20" width="18" height="18"><path d="M6 3h8v3.5a4 4 0 0 1-8 0z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M6 4H3.5v1.5A2.5 2.5 0 0 0 6 8m8-4h2.5v1.5A2.5 2.5 0 0 1 14 8M10 10.5V14m-2.5 3h5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span>Лиги</span></a>
  </nav>

  <main id="view" class="view" aria-live="polite"></main>
</div>

<aside id="drawer" class="drawer" hidden aria-label="Карточка игрока">
  <div class="drawer-backdrop" data-close></div>
  <div class="drawer-panel" role="dialog" aria-modal="true">
    <button class="drawer-close" data-close aria-label="Закрыть">✕</button>
    <div id="drawer-body"></div>
  </div>
</aside>

<div id="tooltip" class="tooltip" hidden></div>

<script src="/app.js" type="module"></script>
</body>
</html>
